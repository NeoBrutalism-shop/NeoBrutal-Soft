name: Soft browser QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install QA dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Bootstrap missing visual baselines
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          snapshot_dir="tests/visual-regression.spec.mjs-snapshots"
          light="$snapshot_dir/soft-reference-light-chromium-linux.png"
          dark="$snapshot_dir/soft-reference-dark-chromium-linux.png"

          if [[ ! -f "$light" || ! -f "$dark" ]]; then
            npx playwright test tests/visual-regression.spec.mjs --project=chromium --update-snapshots
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$light" "$dark"
            git commit -m "test: approve initial visual baselines"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run browser QA
        run: npm run test:browser

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soft-browser-qa
          path: playwright-report
          retention-days: 14

      - name: Upload raw browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soft-browser-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
